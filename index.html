
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Snow</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar bg-light">
    <div class="container d-flex justify-content-between">

      <ul class="nav">
        <li class="nav-item p-1">
          <a class="text-dark" href="#facebook" aria-label="Facebook">
            <i class="bi bi-facebook"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#twitter" aria-label="Twitter">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#pinterest" aria-label="Pinterest">
            <i class="bi bi-pinterest"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#instagram" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
          </a>
        </li>
      </ul>

      <ul class="nav justify-content-end">

        <li class="nav-item p-1">
          <a class="text-dark" href="#home" aria-label="Home">
            <i class="bi bi-house-fill"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#search" aria-label="Search">
            <i class="bi bi-search"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#account" aria-label="Account">
            <i class="bi bi-person-fill"></i>
          </a>
        </li>

        <li class="nav-item dropdown p-1">
          <a
            class="text-dark text-decoration-none dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-label="My Cart"
          >
            <i class="bi bi-cart"></i> 0
          </a>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <h6 class="dropdown-header">My Cart</h6>
            </li>

            <li>
              <span class="dropdown-item-text">
                Your cart is currently empty.
              </span>
            </li>
          </ul>
        </li>

      </ul>
    </div>
  </nav>

  <main class="container">
    <section id="home"></section>
    <section id="search"></section>
    <section id="account"></section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
