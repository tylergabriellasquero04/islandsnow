
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Snow</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar bg-light">
    <div class="container d-flex justify-content-between">

      <ul class="nav">
        <li class="nav-item p-1">
          <a class="text-dark" href="#facebook" aria-label="Facebook">
            <i class="bi bi-facebook"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#twitter" aria-label="Twitter">
            <i class="bi bi-twitter"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#pinterest" aria-label="Pinterest">
            <i class="bi bi-pinterest"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#instagram" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
          </a>
        </li>
      </ul>

      <ul class="nav justify-content-end">

        <li class="nav-item p-1">
          <a class="text-dark" href="#home" aria-label="Home">
            <i class="bi bi-house-fill"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#search" aria-label="Search">
            <i class="bi bi-search"></i>
          </a>
        </li>

        <li class="nav-item p-1">
          <a class="text-dark" href="#account" aria-label="Account">
            <i class="bi bi-person-fill"></i>
          </a>
        </li>

        <li class="nav-item dropdown p-1">
          <a
            class="text-dark text-decoration-none dropdown-toggle"
            href="#"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-cart"></i> 0
          </a>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <h6 class="dropdown-header">My Cart</h6>
            </li>
            <li>
              <span class="dropdown-item-text">
                Your cart is currently empty.
              </span>
            </li>
          </ul>
        </li>

      </ul>
    </div>
  </nav>

  <div class="container" id="home">

    <div class="row">
      <div class="col">
        <img
          src="islandsnow-logo.png"
          class="img-fluid rounded mx-auto d-block py-1"
          alt="Island Snow Logo"
        >
      </div>
    </div>

    <div class="row justify-content-center pt-4 text-center">

      <div class="col">
        <a class="text-dark text-decoration-none" href="#men">
          MEN
        </a>
      </div>

      <div class="col">
        <a class="text-dark text-decoration-none" href="#women">
          WOMEN
        </a>
      </div>

      <div class="col">
        <a class="text-dark text-decoration-none" href="#kids">
          KIDS
        </a>
      </div>

      <div class="col">
        <a class="text-dark text-decoration-none" href="#brands">
          BRANDS
        </a>
      </div>

      <div class="col">
        <a class="text-dark text-decoration-none" href="#search">
          SEARCH
        </a>
      </div>

    </div>

  </div>

  <div class="container-fluid px-0 mt-4">
    <div class="row justify-content-center g-0">
      <div class="col">
        <img
          src="https://courses.ics.hawaii.edu/ics314f26/morea/ui-frameworks/experience-islandsnow-bootstrap-main.png"
          class="img-fluid w-100 d-block"
          alt="Island Snow model sitting on a bridge"
        >
      </div>
    </div>
  </div>

  <footer class="py-5">
    <div class="container">
      <div class="row">

        <div class="col-md-4">
          <h5>NAVIGATION</h5>
          <hr>

          <p>About Us</p>
          <p>Contact Us</p>
          <p>Shipping & Returns</p>
          <p>Privacy Policy</p>
        </div>

        <div class="col-md-4">
          <h5>MAIN MENU</h5>
          <hr>

          <p>Men</p>
          <p>Women</p>
          <p>Kids</p>
          <p>Brands</p>
          <p>Search</p>
        </div>

        <div class="col-md-4">
          <h5>CONNECT</h5>
          <hr>

          <p>Sign up for the latest updates and promotions.</p>

          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Enter your email address"
              aria-label="Email address"
            >

            <button class="btn btn-dark" type="button">
              Join
            </button>
          </div>
        </div>

      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  ></script>

</body>
</html>
